<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <title>Music Player</title>
</head>
<body>
    <header>
        <i class="menu fa-solid fa-bars"></i>
        <div class="icon">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
            <i class="fa-brands fa-x-twitter"></i>
            <i class="fa-brands fa-twitch"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-discord"></i>
        </div>
        <img class="websvg" src="Assets/monstercat-logo.webp" alt="">
    </header>
    <section class="hero">
        <div class="album-side">
            <p>Instinct — Released May 22, 2020</p>
            <img src="Assets/album.webp" alt="album">
        </div>
        <div class="text-side">
            <h1>Level Days <span><br>Conro</span></h1>
            <div class="btn-div">
                <button class="btn play-btn"><i class="  fa-solid fa-play"></i>Play Now</button>
                <button class="btn share-btn"><i class="  fa-solid fa-share"></i>Share</button>
            </div>
        </div>
    </section>

    
</body>
</html>
